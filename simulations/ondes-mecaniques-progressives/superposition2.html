<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principe de Superposition des Ondes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 { text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 20px; }
        
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }

        canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            flex: 1;
            text-align: center;
        }

        .control-box h3 { margin-top: 0; margin-bottom: 10px; font-size: 16px; color: #444; }

        select {
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: all 0.2s;
        }

        #btnPlay { background-color: #28a745; color: white; }
        #btnPlay:hover { background-color: #218838; }
        
        #btnReset { background-color: #6c757d; color: white; }
        #btnReset:hover { background-color: #5a6268; }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .line-box { width: 30px; height: 3px; }
        .line-result { background-color: #2c3e50; height: 4px;}
        .line-comp1 { border-top: 2px dashed #e74c3c; }
        .line-comp2 { border-top: 2px dashed #3498db; }

        #explanation {
            margin-top: 15px;
            font-weight: bold;
            color: #d35400;
            text-align: center;
            min-height: 24px;
        }
    </style>
    <link rel="stylesheet" href="ondes-responsive.css">
</head>
<body>

    <h1>Principe de Superposition</h1>
    <p class="subtitle">Observez le croisement de deux ondes sur une corde (y = y₁ + y₂)</p>

    <div class="container">
        <canvas id="simCanvas" width="800" height="300"></canvas>
        
        <div class="legend">
            <div class="legend-item"><div class="line-box line-result"></div> Corde réelle (Superposition)</div>
            <div class="legend-item"><div class="line-box line-comp1"></div> Onde 1 "fantôme"</div>
            <div class="legend-item"><div class="line-box line-comp2"></div> Onde 2 "fantôme"</div>
        </div>

        <p id="explanation"></p>

        <div class="controls-panel">
            <div class="control-box">
                <h3 style="color: #e74c3c;">Onde 1 (Petite, venant de gauche)</h3>
                <select id="dir1">
                    <option value="1">Impulsion vers le HAUT (+)</option>
                    <option value="-1">Impulsion vers le BAS (-)</option>
                </select>
            </div>
            
            <div class="control-box">
                <h3 style="color: #3498db;">Onde 2 (Grande, venant de droite)</h3>
                <select id="dir2">
                    <option value="1">Impulsion vers le HAUT (+)</option>
                    <option value="-1">Impulsion vers le BAS (-)</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <button id="btnPlay">▶ Démarrer / Pause</button>
            <button id="btnReset">↻ Réinitialiser</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const btnPlay = document.getElementById('btnPlay');
        const btnReset = document.getElementById('btnReset');
        const dir1Select = document.getElementById('dir1');
        const dir2Select = document.getElementById('dir2');
        const explanationText = document.getElementById('explanation');

        // Paramètres de la simulation
        let isRunning = false;
        let time = 0;
        const speed = 2.5; // Vitesse de propagation
        const centerY = canvas.height / 2;
        
        // Paramètres des ondes (Amplitude, Largeur, Position de départ)
        // Onde 1 : Plus petite (comme sur votre schéma)
        const wave1 = { amp: 40, width: 25, startX: 100, direction: 1 }; 
        // Onde 2 : Plus grande
        const wave2 = { amp: 70, width: 30, startX: 700, direction: -1 };

        function updateExplanation() {
            const val1 = parseInt(dir1Select.value);
            const val2 = parseInt(dir2Select.value);
            if (val1 === val2) {
                explanationText.textContent = "Interférence CONSTRUCTIVE : Les amplitudes s'additionnent et créent une onde plus grande lors du croisement.";
                explanationText.style.color = "#27ae60";
            } else {
                explanationText.textContent = "Interférence DESTRUCTIVE : Les amplitudes se soustraient. L'onde s'aplatit ou s'inverse lors du croisement.";
                explanationText.style.color = "#c0392b";
            }
        }

        // Fonction mathématique pour créer la forme de l'onde (Courbe de Gauss)
        function calculateDisplacement(x, wavePos, amplitude, width, sign) {
            // y = A * e^(-((x-x0)/W)^2)
            return sign * amplitude * Math.exp(-Math.pow((x - wavePos) / width, 2));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Ligne d'équilibre (pointillés fins)
            ctx.beginPath();
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.strokeStyle = "#ccc";
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]); // Reset des pointillés

            // Calcul des positions actuelles des ondes
            const pos1 = wave1.startX + (time * speed);
            const pos2 = wave2.startX - (time * speed);

            const sign1 = parseInt(dir1Select.value);
            const sign2 = parseInt(dir2Select.value);

            // 1. Dessiner les ondes "fantômes" (les composantes individuelles) pour la pédagogie
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x++) {
                let y = centerY - calculateDisplacement(x, pos1, wave1.amp, wave1.width, sign1);
                x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.strokeStyle = "rgba(231, 76, 60, 0.6)"; // Rouge transparent
            ctx.setLineDash([6, 4]);
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            for (let x = 0; x < canvas.width; x++) {
                let y = centerY - calculateDisplacement(x, pos2, wave2.amp, wave2.width, sign2);
                x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            }
            ctx.strokeStyle = "rgba(52, 152, 219, 0.6)"; // Bleu transparent
            ctx.setLineDash([6, 4]);
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);

            // 2. Dessiner la corde RÉELE (Le principe de superposition : y = y1 + y2)
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x++) {
                let y1 = calculateDisplacement(x, pos1, wave1.amp, wave1.width, sign1);
                let y2 = calculateDisplacement(x, pos2, wave2.amp, wave2.width, sign2);
                
                // LE CŒUR DE LA SIMULATION EST CETTE ADDITION ALGEBRIQUE :
                let yTotal = y1 + y2; 
                
                let yCanvas = centerY - yTotal; // - car l'axe Y du canvas va vers le bas
                x === 0 ? ctx.moveTo(x, yCanvas) : ctx.lineTo(x, yCanvas);
            }
            ctx.strokeStyle = "#2c3e50"; // Gris foncé / Noir
            ctx.lineWidth = 4;
            ctx.lineJoin = "round";
            ctx.stroke();

            // Flèches de direction
            if (time < 120) {
                // Flèche onde 1
                ctx.fillStyle = "#e74c3c";
                ctx.font = "20px Arial";
                let arrY1 = sign1 === 1 ? centerY - wave1.amp - 10 : centerY + wave1.amp + 20;
                ctx.fillText("→", pos1 - 10, arrY1);
                
                // Flèche onde 2
                ctx.fillStyle = "#3498db";
                let arrY2 = sign2 === 1 ? centerY - wave2.amp - 10 : centerY + wave2.amp + 20;
                ctx.fillText("←", pos2 - 10, arrY2);
            }
        }

        function animate() {
            if (isRunning) {
                time++;
                // Arrêt automatique quand les ondes sont sorties de l'écran
                if (time * speed > canvas.width) {
                    isRunning = false;
                    btnPlay.innerHTML = "▶ Démarrer";
                }
            }
            draw();
            requestAnimationFrame(animate);
        }

        // Écouteurs d'événements
        btnPlay.addEventListener('click', () => {
            isRunning = !isRunning;
            btnPlay.innerHTML = isRunning ? "⏸ Pause" : "▶ Démarrer";
            if (time * speed > canvas.width) {
                time = 0; // Recommencer si c'était fini
                isRunning = true;
                btnPlay.innerHTML = "⏸ Pause";
            }
        });

        btnReset.addEventListener('click', () => {
            isRunning = false;
            time = 0;
            btnPlay.innerHTML = "▶ Démarrer";
            draw();
        });

        dir1Select.addEventListener('change', () => { updateExplanation(); draw(); });
        dir2Select.addEventListener('change', () => { updateExplanation(); draw(); });

        // Initialisation
        updateExplanation();
        draw();
        animate();

    </script>
</body>
</html>
